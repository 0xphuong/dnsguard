<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
        <meta name="google" content="notranslate" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <title>Setup DNSGuard</title>
        <meta name="color-scheme" content="light dark" />
        <script>
            (function () {
                var theme = null;
                try {
                    var raw = window.localStorage.getItem('account_theme');
                    if (raw) {
                        try {
                            theme = JSON.parse(raw);
                        } catch (e) {
                            theme = raw;
                        }
                    }
                } catch (e) {}
                if (theme === 'auto') {
                    var prefersDark =
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches;
                    theme = prefersDark ? 'dark' : 'light';
                } else if (theme !== 'dark' && theme !== 'light') {
                    // Never chose one, so match what the server now stores for
                    // a fresh install and what the NexGuard portal ships:
                    // light.  'auto' still means follow the OS.
                    theme = 'light';
                }
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            })();
        </script>
    </head>
    <body>
        <noscript> You need to enable JavaScript to run this app. </noscript>
        <div id="root"></div>
    </body>
</html>
